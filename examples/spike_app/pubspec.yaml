name: spike_app
description: "Boundary spike, a tiny notes app testing the cubit-adapter-view pattern."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.0
  go_router: ^17.0.1
  cubit_ui_flow:
    path: ../../packages/cubit_ui_flow
  systematic_catalog:
    path: ../../packages/catalog
  systematic_ui:
    path: ../../packages/ui
  flutter_color_palette:
    path: ../../packages/color_palette
  l10n_key_resolver:
    path: ../../packages/l10n
  systematic_failure:
    path: ../../packages/systematic_failure
  flutter_error_privserver:
    path: ../../packages/error_privserver
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.0
  l10n_generator:
    path: ../../packages/l10n_generator

flutter:
  uses-material-design: true
  generate: true
