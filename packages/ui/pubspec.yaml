name: systematic_ui
description: Shared design system bones for the Systematic Flutter apps.
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  l10n_key_resolver:
    path: ../l10n
  flutter_color_palette:
    git:
      url: https://github.com/qtpi-bonding-org/flutter_color_palette.git
      ref: e8755f5993cb66c6dfd4696df87bf6ef64229756

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.5.0
  freezed: ^4.0.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
