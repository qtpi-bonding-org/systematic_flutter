name: systematic_ui
description: Shared design system bones for the Systematic Flutter apps.
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  l10n_key_resolver:
    path: ../l10n
  flutter_color_palette:
    path: ../color_palette

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.5.0
  freezed: ^4.0.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
