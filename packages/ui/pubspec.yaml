name: systematic_ui
description: Shared design system bones for the Systematic Flutter apps.
version: 0.1.0

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  freezed_annotation: ^3.1.0
  l10n_key_resolver:
    git:
      url: https://github.com/qtpi-bonding-org/systematic_flutter.git
      path: packages/l10n
      tag_pattern: "l10n_key_resolver-v{{version}}"
    version: ^0.2.0
  flutter_color_palette:
    path: ../color_palette

  material_ui: ^1.11.1
dev_dependencies:
  build_runner: ^2.5.0
  freezed: ^4.0.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
