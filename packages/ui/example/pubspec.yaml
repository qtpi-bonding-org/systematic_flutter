name: qtpi_ui_storybook
description: Standalone Storybook host for qtpi_ui.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  qtpi_ui:
    path: ../
  flutter_color_palette:
