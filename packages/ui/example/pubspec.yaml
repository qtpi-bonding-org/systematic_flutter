      url: https://github.com/qtpi-bonding-org/flutter_color_palette.git
      ref: e8755f5993cb66c6dfd4696df87bf6ef64229756

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
