name: flutter_error_privserver
description: Privacy-preserving error reporting library for Flutter apps using cubit_ui_flow.
version: 0.1.0
homepage: https://github.com/qtpi-bonding-org/systematic_flutter
publish_to: none

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cubit_ui_flow:
    path: ../cubit_ui_flow
  systematic_failure:
    git:
      url: https://github.com/qtpi-bonding-org/systematic_flutter.git
      path: packages/systematic_failure
      tag_pattern: "systematic_failure-v{{version}}"
    version: ^0.1.1
  flutter_bloc: ^8.1.0
  uuid: ^4.0.0
  crypto: ^3.0.0
  shared_preferences: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
