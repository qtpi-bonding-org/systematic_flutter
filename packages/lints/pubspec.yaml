name: systematic_lints
description: Analyzer plugin enforcing design-system and cubit_ui_flow discipline. Options come from lint_config.yaml in the analyzed package.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.9.0

dependencies:
  analysis_server_plugin: 0.3.22
  analyzer: 14.3.0
  meta: ^1.16.0
  glob: ^2.1.0
  path: ^1.9.0
  yaml: ^3.1.0

dev_dependencies:
  analyzer_testing: 0.4.1
  test: ^1.25.0
  test_reflective_loader: ^0.4.0

plugin:
  platforms:
    dart:
      pluginClass: SystematicLintsPlugin
      fileName: main.dart
