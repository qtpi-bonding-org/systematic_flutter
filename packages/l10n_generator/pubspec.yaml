name: l10n_generator
description: build_runner generator that turns ARB files into typed L10nKeys and an L10nKeyResolver for l10n_key_resolver's Label types.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  build: ">=2.4.0 <5.0.0"
  glob: ^2.1.0
  path: ^1.8.0
  l10n_key_resolver:
    git:
      url: https://github.com/qtpi-bonding-org/systematic_flutter.git
      path: packages/l10n
      tag_pattern: "l10n_key_resolver-v{{version}}"
    version: ^0.2.0

dev_dependencies:
  build_runner: ^2.5.0
  build_test: ^3.0.0
  logging: ^1.2.0
  test: ^1.24.0
  lints: ^3.0.0
