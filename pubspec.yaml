name: flutter_lint_generator
description: Custom Dart analyzer plugin (rules + a config codegen step) enforcing design-system and cubit_ui_flow discipline, surfaced directly in flutter analyze/dart analyze.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.9.0

dependencies:
  analysis_server_plugin: 0.3.22
  analyzer: 14.3.0
  meta: ^1.16.0
  yaml: ^3.1.0

dev_dependencies:
  analyzer_testing: 0.4.1
  test: ^1.25.0
  test_reflective_loader: ^0.4.0

plugin:
  platforms:
    dart:
      pluginClass: FlutterLintGeneratorPlugin
      fileName: main.dart
